name: 问题报告
description: 报告可复现的问题
body:
  - type: markdown
    attributes:
      value: 请先移除日志、截图和路径中的个人信息。不要提供密码、验证码或完整战网账号配置。
  - type: input
    id: version
    attributes:
      label: 切换器版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、系统架构、屏幕缩放、.NET Desktop Runtime 版本及 MSI／便携版。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
  - type: textarea
    id: error
    attributes:
      label: 错误信息
      description: 如涉及游戏安装，可补充两服版本和去除个人信息后的路径结构。
