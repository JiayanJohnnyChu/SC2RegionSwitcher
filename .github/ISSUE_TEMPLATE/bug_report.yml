name: Bug report (English)
description: Report a reproducible problem in English.
body:
  - type: markdown
    attributes:
      value: Include the application version, environment and steps that reproduce the problem. Relevant error text or redacted screenshots can help explain the result.
  - type: input
    id: version
    attributes:
      label: Switcher version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, system architecture, display scaling, .NET Desktop Runtime version, and MSI or portable package.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: textarea
    id: error
    attributes:
      label: Error details
      description: For game-installation issues, include both game versions and the relevant path structure with personal information removed.
