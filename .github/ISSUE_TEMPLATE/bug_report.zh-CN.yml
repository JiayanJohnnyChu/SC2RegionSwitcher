name: 问题报告（简体中文）
description: 使用简体中文报告可复现的问题。
body:
  - type: markdown
    attributes:
      value: 请提供应用版本、运行环境和复现步骤。相关错误文字或脱敏截图有助于说明实际结果。
  - type: input
    id: version
    attributes:
      label: 切换器版本
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: Windows 版本、系统架构、屏幕缩放、.NET Desktop Runtime 版本，以及 MSI 或便携包。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
  - type: textarea
    id: error
    attributes:
      label: 错误详情
      description: 涉及游戏安装时，请补充两服版本和移除个人信息后的相关路径结构。
