name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare workflow checker
        run: .\scripts\Setup-WorkflowTools.ps1
      - name: Check workflows
        run: .\scripts\Check-Workflows.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Check repository contents
        run: .\scripts\Check-Repository.ps1
      - name: Build
        run: .\scripts\Build.ps1
      - name: Isolated regression tests
        run: .\scripts\Test.ps1
      - name: Package
        id: package
        run: .\scripts\Package.ps1
      - name: Check release payload
        env:
          RELEASE_DIRECTORY: ${{ steps.package.outputs.release-directory }}
        run: .\scripts\Test-Package.ps1 -ReleaseDirectory $env:RELEASE_DIRECTORY
      - name: Check release rejection cases
        env:
          RELEASE_DIRECTORY: ${{ steps.package.outputs.release-directory }}
        run: .\scripts\Test-ReleaseGuards.ps1 -ReleaseDirectory $env:RELEASE_DIRECTORY
      - name: Upload preview packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SC2RegionSwitcher-win-x64-preview
          path: ${{ steps.package.outputs.release-directory }}/*
          if-no-files-found: error
          retention-days: 14
