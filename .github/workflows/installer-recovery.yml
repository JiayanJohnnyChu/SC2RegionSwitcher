name: Isolated ordinary-user installer recovery

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Successful main CI run whose original MSI will be checked'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: installer-recovery-${{ inputs.candidate_run_id }}
  cancel-in-progress: false

jobs:
  ordinary-user-recovery:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve the original candidate source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:CANDIDATE_RUN_ID -notmatch '^\d+$'){throw 'Invalid candidate run ID.'}
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read candidate run.'}
          if($run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/ci.yml' -or $run.head_sha -notmatch '^[0-9a-f]{40}$'){throw 'Expected a successful main build from ci.yml.'}
          "source-commit=$($run.head_sha)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download original candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE: ${{ steps.candidate.outputs.source-commit }}
        run: |
          $ErrorActionPreference='Stop'
          $destination=Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-rollback-input'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name SC2RegionSwitcher-win-x64-preview --dir $destination
          if($LASTEXITCODE -ne 0){throw 'Cannot download the original candidate.'}
          .\scripts\Test-Package.ps1 -ReleaseDirectory $destination -ExpectedSourceCommit $env:CANDIDATE_SOURCE
          $manifest=Get-Content -LiteralPath (Join-Path $destination 'release-manifest.json') -Raw | ConvertFrom-Json
          if([string]$manifest.CiRunId -ne $env:CANDIDATE_RUN_ID -or $manifest.WorkingTreeDirty){throw 'Candidate provenance mismatch.'}
      - name: Check recovery as a fresh standard user
        run: |
          $directory=Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-rollback-input'
          $manifest=Get-Content -LiteralPath (Join-Path $directory 'release-manifest.json') -Raw | ConvertFrom-Json
          .\tools\Installer\Test-CiRollback.ps1 -CandidateMsi (Join-Path $directory "SC2Switcher-$($manifest.Version)-current-user.msi")
      - name: Upload isolated recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SC2RegionSwitcher-installer-recovery
          path: artifacts/ci-installer-rollback/**
          if-no-files-found: warn
          retention-days: 14
