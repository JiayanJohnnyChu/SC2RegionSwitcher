name: Historical per-user installer recovery
run-name: '${{ inputs.privilege_context }} recovery for candidate ${{ inputs.candidate_run_id }}'

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Historical per-user candidate CI run; use installer-lifecycle for machine packages'
        required: true
        type: string
      privilege_context:
        description: 'Standard user acceptance or a separate administrative diagnostic control'
        required: true
        type: choice
        default: standard-user
        options:
          - standard-user
          - administrative-control

permissions:
  contents: read
  actions: read

concurrency:
  group: installer-recovery-${{ inputs.candidate_run_id }}-${{ inputs.privilege_context }}
  cancel-in-progress: false

jobs:
  isolated-recovery:
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Resolve the original candidate source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:CANDIDATE_RUN_ID -notmatch '^\d+$'){throw 'Invalid candidate run ID.'}
          $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CANDIDATE_RUN_ID" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot read candidate run.'}
          if($run.conclusion -ne 'success' -or $run.event -ne 'push' -or $run.head_branch -ne 'main' -or $run.path -ne '.github/workflows/ci.yml' -or $run.head_sha -notmatch '^[0-9a-f]{40}$'){throw 'Expected a successful main build from ci.yml.'}
          "source-commit=$($run.head_sha)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.source-commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record Windows client test environment
        env:
          CANDIDATE_SOURCE: ${{ steps.candidate.outputs.source-commit }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          PRIVILEGE_CONTEXT: ${{ inputs.privilege_context }}
        run: |
          $ErrorActionPreference='Stop'
          $os=Get-CimInstance Win32_OperatingSystem
          $directory=Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-installer-rollback'
          [void][IO.Directory]::CreateDirectory($directory)
          [ordered]@{
            Caption=$os.Caption
            Version=$os.Version
            BuildNumber=$os.BuildNumber
            ProductType=$os.ProductType
            OSArchitecture=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
            ProcessArchitecture=[Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
            InstallerVersion=[Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $env:WINDIR 'System32\msi.dll')).FileVersion
            CandidateSource=$env:CANDIDATE_SOURCE
            WorkflowSource=$env:WORKFLOW_SOURCE
            PrivilegeContext=$env:PRIVILEGE_CONTEXT
            Scope='MSI recovery on a Windows client; not native x64 application or game coverage.'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'environment.json') -Encoding utf8
          if($os.ProductType -ne 1){throw 'Recovery requires a Windows client; Windows Server restricts unmanaged installations.'}
      - name: Download original candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE: ${{ steps.candidate.outputs.source-commit }}
        run: |
          $ErrorActionPreference='Stop'
          $destination=Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-rollback-input'
          gh run download $env:CANDIDATE_RUN_ID --repo $env:GITHUB_REPOSITORY --name SC2RegionSwitcher-win-x64-preview --dir $destination
          if($LASTEXITCODE -ne 0){throw 'Cannot download the original candidate.'}
          .\scripts\Test-Package.ps1 -ReleaseDirectory $destination -ExpectedSourceCommit $env:CANDIDATE_SOURCE
          $manifest=Get-Content -LiteralPath (Join-Path $destination 'release-manifest.json') -Raw | ConvertFrom-Json
          if($manifest.InstallScope -eq 'per-machine'){throw 'Use installer-lifecycle.yml for administrator installation candidates.'}
          if([string]$manifest.CiRunId -ne $env:CANDIDATE_RUN_ID -or $manifest.WorkingTreeDirty){throw 'Candidate provenance mismatch.'}
      - name: Check recovery in the selected isolated context
        env:
          PRIVILEGE_CONTEXT: ${{ inputs.privilege_context }}
          WORKFLOW_SOURCE: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $directory=Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-rollback-input'
          $manifest=Get-Content -LiteralPath (Join-Path $directory 'release-manifest.json') -Raw | ConvertFrom-Json
          $toolsDirectory=Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-recovery-tools'
          [void][IO.Directory]::CreateDirectory($toolsDirectory)
          $harness=Join-Path $toolsDirectory 'Test-CiRollback.ps1'
          $content=git show "$($env:WORKFLOW_SOURCE):tools/Installer/Test-CiRollback.ps1"
          if($LASTEXITCODE -ne 0){throw 'Cannot read the recovery harness from the workflow revision.'}
          $content | Set-Content -LiteralPath $harness -Encoding utf8
          [ordered]@{
            SourceCommit=$env:WORKFLOW_SOURCE
            SHA256=(Get-FileHash -LiteralPath $harness).Hash
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\ci-installer-rollback\harness.json') -Encoding utf8
          $administrativeControl=$env:PRIVILEGE_CONTEXT -eq 'administrative-control'
          & $harness -CandidateMsi (Join-Path $directory "SC2Switcher-$($manifest.Version)-current-user.msi") -AdministrativeControl:$administrativeControl
      - name: Upload isolated recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SC2RegionSwitcher-installer-recovery
          path: artifacts/ci-installer-rollback/**
          if-no-files-found: warn
          retention-days: 14
