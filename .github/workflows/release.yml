name: Promote tested candidate to draft prerelease

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Existing preview tag at the tested source commit'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful main CI run whose original files were tested'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version_tag }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version_tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Promote original candidate and verify uploaded files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: .\scripts\Promote-Candidate.ps1 -VersionTag $env:RELEASE_TAG -CandidateRunId $env:CANDIDATE_RUN_ID